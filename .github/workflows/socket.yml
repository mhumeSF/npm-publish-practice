name: Socket

# Supply-chain scanning via Socket. This package has ZERO runtime dependencies,
# so this is primarily here to demonstrate the integration and to catch the
# introduction of any future dependency.
#
# Free mode ("Socket Firewall: Free") requires no account and no token: it
# installs `sfw` and proxies the install, blocking known-malicious packages.
# For richer PR-level analysis, install the Socket GitHub App as well (see
# SETUP.md) — that requires a (free) Socket account.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  socket:
    name: socket
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install Socket Firewall (free)
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      # Run the locked install through Socket Firewall. With zero dependencies
      # this is a fast no-op today, but it guards every future install.
      - name: Locked install through Socket
        run: sfw npm ci
