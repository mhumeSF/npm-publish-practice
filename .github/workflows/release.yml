name: Release

# Publishes to npm. Triggers ONLY on a pushed version tag (v*) — never on a
# plain push to main. Publishing uses npm Trusted Publishing (GitHub OIDC):
# there is NO npm token anywhere. A short-lived (~15 min) OIDC-minted credential
# is the only thing used, and provenance attestation is generated at publish.
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    # Scopes the OIDC claim to this environment. Configure the trusted publisher
    # on npmjs.com with Environment = "release" (see SETUP.md).
    environment: release
    permissions:
      contents: read
      id-token: write # REQUIRED for OIDC trusted publishing + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no dependency cache in publish path (cache-poisoning)
      # Trusted publishing requires npm >= 11.5.1. Node 24 ships a new-enough
      # npm, but pin it explicitly so a runner image change can't silently
      # regress us below the minimum.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@11.5.1
          npm --version
      - name: Install (locked)
        run: npm ci
      - name: Test
        run: npm test
      - name: Syntax check
        run: npm run lint
      # No NODE_AUTH_TOKEN, no .npmrc auth — OIDC is detected automatically.
      # --provenance emits a verifiable build attestation; --access public is
      # required to publish a scoped package publicly on first release.
      - name: Publish to npm (OIDC + provenance)
        run: npm publish --provenance --access public
